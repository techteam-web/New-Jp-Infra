    <title>JP INFRA</title>
    <script>
      // Every load starts the intro from the top: no browser scroll restoration, and the
      // position is reset on the way out so nothing is remembered for the next load.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.scrollTo(0, 0)
      window.addEventListener('pagehide', function () { window.scrollTo(0, 0) })
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
